    // ===== RENDER =====
    let selectedDate = Object.keys(ALL_NEWS).sort().pop();

    function renderDateList() {
        const dates = Object.keys(ALL_NEWS).sort().reverse();
        const container = document.getElementById('dateList');
        container.innerHTML = '';
        dates.forEach(date => {
            const today = new Date().toISOString().split('T')[0];
            const label = date === today ? t('today') + ' (' + date + ')' : date;
            const btn = document.createElement('button');
            btn.className = `date-btn w-full text-left px-3 py-2 rounded-lg text-sm border border-transparent ${date === selectedDate ? 'active' : 'text-gray-400'}`;
            btn.textContent = label;
            btn.onclick = () => { selectedDate = date; renderDateList(); renderNews(); };
            container.appendChild(btn);
        });
    }

    function renderNews() {
        const data = ALL_NEWS[selectedDate];
        const container = document.getElementById('newsContainer');
        if (!data) {
            container.innerHTML = `<div class="text-center py-20 text-gray-500">${t('no_news')}</div>`;
            return;
        }
        // Update hero date
        document.getElementById('heroDate').textContent = data.dateDisplay[currentLang] || data.dateDisplay.zh;
        document.getElementById('footerDate').textContent = data.date;
        let html = '';
        // Stats
        if (data.stats && data.stats.length) {
            html += `<div class="max-w-6xl mx-auto mb-12"><div class="grid grid-cols-2 md:grid-cols-4 gap-4" data-aos="fade-up">`;
            data.stats.forEach(s => {
                html += `<div class="stat-card rounded-2xl p-6 text-center"><div class="text-3xl font-bold text-${s.color}-400 mb-1">${s.value}</div><div class="text-sm text-gray-500">${currentLang === 'en' && s.label.en ? s.label.en : s.label.zh}</div></div>`;
            });
            html += `</div></div>`;
        }
        // Sections
        if (data.sections) {
            data.sections.forEach((section, si) => {
                const titleText = currentLang === 'en' && section.title.en ? section.title.en : section.title.zh;
                const subtitleText = currentLang === 'en' && section.subtitle.en ? section.subtitle.en : section.subtitle.zh;
                html += `<div class="max-w-5xl mx-auto mb-16" data-aos="fade-up" data-aos-delay="${si * 50}">`;
                html += `<div class="flex items-center gap-4 mb-8"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${section.gradient} flex items-center justify-center text-white text-xl"><i class="${section.icon}"></i></div><div><h2 class="text-2xl font-bold text-white">${titleText}</h2><p class="text-gray-500 text-sm mt-1">${subtitleText}</p></div></div>`;
                html += `<div class="grid grid-cols-1 ${section.type === 'quick' ? 'md:grid-cols-2' : 'md:grid-cols-2'} gap-4">`;
                section.cards.forEach((card, ci) => {
                    const cardTitle = currentLang === 'en' && card.title.en ? card.title.en : card.title.zh;
                    const cardContent = currentLang === 'en' && card.content.en ? card.content.en : card.content.zh;
                    const tagText = card.tag && card.tag.text ? (currentLang === 'en' && card.tag.text.en ? card.tag.text.en : card.tag.text.zh) : '';
                    const cardUrl = card.url || '';
                    const linkOpen = cardUrl ? `<a href="${cardUrl}" target="_blank" rel="noopener noreferrer" class="block group">` : '';
                    const linkClose = cardUrl ? '</a>' : '';
                    const viewSourceText = t('view_source');
const linkHint = cardUrl ? '<div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-arrow-up-right-from-square text-brand-400 text-xs"></i></div>' : '';
                    if (section.type === 'quick') {
                        html += `${linkOpen}<div class="bg-dark-800/50 backdrop-blur border border-white/5 rounded-2xl p-5 card-glow transition-all duration-300 flex items-start gap-4 relative ${cardUrl ? 'cursor-pointer hover:border-brand-500/30' : ''}" data-aos="fade-up" data-aos-delay="${ci * 50}">${linkHint}<div class="w-2 h-2 rounded-full bg-brand-400 mt-2.5 flex-shrink-0"></div><div><div class="text-white font-bold text-sm mb-1">${cardTitle}</div><div class="text-xs text-gray-500">${cardContent}</div>${cardUrl ? `<div class="text-xs text-brand-400 mt-2 opacity-70"><i class="fa-solid fa-arrow-right mr-1"></i>${viewSourceText}</div>` : ''}</div></div>${linkClose}`;
                    } else {
                        html += `${linkOpen}<div class="bg-dark-800/50 backdrop-blur border border-white/5 rounded-2xl p-6 card-glow transition-all duration-300 relative ${cardUrl ? 'cursor-pointer hover:border-brand-500/30' : ''}" data-aos="fade-up" data-aos-delay="${ci * 50}">${linkHint}<div class="flex flex-wrap items-center gap-2 mb-2"><h3 class="text-lg font-bold text-white">${cardTitle}</h3>${tagText ? `<span class="${card.tag.class} text-xs px-2 py-0.5 rounded-full font-medium">${tagText}</span>` : ''}</div><p class="text-sm text-gray-400 leading-relaxed mb-3">${cardContent}</p>`;
                        if (card.tags && card.tags.length) {
                            html += `<div class="flex flex-wrap gap-2 mb-2">${card.tags.map(tg => `<span class="tag text-xs px-2 py-1 rounded-full">${tg}</span>`).join('')}</div>`;
                        }
                        if (cardUrl) {
                            html += `<div class="text-xs text-brand-400 opacity-70 mt-2"><i class="fa-solid fa-arrow-right mr-1"></i>${viewSourceText}</div>`;
                        }
                        html += `</div>${linkClose}`;
                    }
                });
                html += `</div></div>`;
            });
        }
        container.innerHTML = html;
        AOS.refresh();
    }

    // ===== INIT =====
    applyI18N();
    renderDateList();
    renderNews();
    AOS.init({ once: true, offset: 80 });
    </script>
</body>
</html>
